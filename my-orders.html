<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My orders – SamalBakes</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SamalBakes" />
  <meta property="og:title" content="My orders – SamalBakes" />
  <meta property="og:image" content="https://samalbakes.com/assets/og-image.png" />
  <meta property="og:image:alt" content="Samal Bakes logo: cakes and breads, Samal Island" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">
        <picture>
          <source srcset="assets/logo-header.webp" type="image/webp" />
          <img src="assets/logo-header.png" alt="Samal Bakes" width="671" height="192" />
        </picture>
      </a>
      <nav class="nav" id="site-nav" aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="delivery.html">Delivery</a>
        <a href="promotions.html">Promos</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-tools">
        <a class="cart-link" href="order.html" aria-label="Order / cart" title="Your order">
          <svg class="cart-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
            <path d="M6.4 10.2h11.2l1.05 10.2H5.35L6.4 10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M8.3 10.2V8.1a1.55 1.55 0 0 1 3.1 0v2.1M12.6 10.2V8.1a1.55 1.55 0 0 1 3.1 0v2.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span id="cart-count" hidden>0</span>
        </a>
        <span data-auth-nav></span>
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
          <span class="nav-toggle-bars" aria-hidden="true"></span>
          <span class="visually-hidden">Open menu</span>
        </button>
      </div>
    </div>
  </header>

    <main class="container" style="padding:2rem 0">
      <div id="orders-login" class="card" hidden><h1>My orders</h1><p>Log in to view your order history.</p><a class="btn primary" href="account.html">Log in</a></div>
      <section id="history" style="margin-top:2rem" hidden>
        <div class="section-head">
          <h1>My orders</h1>
          <p id="history-user" class="muted"></p>
        </div>
        <div id="history-list"></div>
        <p id="history-empty" class="muted" hidden>No orders yet — <a href="menu.html">browse the menu</a>.</p>
      </section>
      <p id="orders-error" class="msg warn" role="status" hidden></p>
    </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="index.html">Back to SamalBakes</a> · Payment: Cash on Delivery</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/promos.js"></script>
<script src="js/product-sizes.js"></script>
<script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/order-confirmation.js"></script>
  <script src="js/my-orders.js"></script>
</body>
</html>
