<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account – SamalBakes</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Samal<span>Bakes</span></a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html#menu">Menu</a>
        <a href="index.html#order">Order</a>
        <span data-auth-nav></span>
      </nav>
    </div>
  </header>

    <main class="container" style="padding:2rem 0">
      <div id="auth-panels">
        <div class="section-head">
          <h1>Your account</h1>
          <p>Register or log in to save orders and see your history. Guest checkout still works on the menu page.</p>
        </div>
        <div id="demo-creds" class="note-banner" hidden></div>
        <div class="order-layout">
          <div class="card" id="login-card">
            <h2>Log in</h2>
            <form id="login-form">
              <div class="field"><label for="login-email">Email</label>
                <input id="login-email" type="email" required autocomplete="username"/></div>
              <div class="field"><label for="login-password">Password</label>
                <input id="login-password" type="password" required autocomplete="current-password"/></div>
              <button class="btn primary" type="submit">Log in</button>
              <div id="login-msg" class="msg info" style="display:none"></div>
            </form>
          </div>
          <div class="card" id="register-card">
            <h2>Register</h2>
            <form id="register-form">
              <div class="field"><label for="reg-name">Name</label>
                <input id="reg-name" type="text" autocomplete="name"/></div>
              <div class="field"><label for="reg-email">Email</label>
                <input id="reg-email" type="email" required autocomplete="username"/></div>
              <div class="field"><label for="reg-password">Password</label>
                <input id="reg-password" type="password" required minlength="6" autocomplete="new-password"/></div>
              <button class="btn secondary" type="submit">Create account</button>
              <div id="reg-msg" class="msg info" style="display:none"></div>
            </form>
          </div>
        </div>
      </div>
      <section id="history" style="margin-top:2rem" hidden>
        <div class="section-head">
          <h2>Order history</h2>
          <p id="history-user" class="muted"></p>
        </div>
        <div id="history-list"></div>
        <p id="history-empty" class="muted" hidden>No orders yet — <a href="index.html#menu">browse the menu</a>.</p>
      </section>
    </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="index.html">Back to SamalBakes</a> · Payment: Cash on Delivery</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
