<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Admin — SamalBakes</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="SamalBakes" />
<meta property="og:title" content="Admin — SamalBakes" />
<meta property="og:image" content="https://samalbakes.com/assets/og-image.png" />
<meta property="og:image:alt" content="Samal Bakes logo: cakes and breads, Samal Island" />
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">
      <picture>
        <source srcset="assets/logo-header.webp" type="image/webp" />
        <img src="assets/logo-header.png" alt="Samal Bakes" width="671" height="192" />
      </picture>
    </a>
    <nav class="nav" id="site-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="delivery.html">Delivery</a>
      <a href="promotions.html">Promos</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-tools">
      <a class="cart-link" href="menu.html#order" aria-label="Order / cart" title="Your order">
        <svg class="cart-icon" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
          <path d="M6.4 10.2h11.2l1.05 10.2H5.35L6.4 10.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M8.3 10.2V8.1a1.55 1.55 0 0 1 3.1 0v2.1M12.6 10.2V8.1a1.55 1.55 0 0 1 3.1 0v2.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span id="cart-count" hidden>0</span>
      </a>
      <span data-auth-nav></span>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span class="visually-hidden">Open menu</span>
      </button>
    </div>
  </div>
</header>
<main class="container" style="padding:2rem 0">
  <div id="admin-gate" class="card">
    <h1>Admin</h1>
    <p class="muted">Checking access…</p>
  </div>
  <div id="admin-app" hidden>
    <div class="section-head">
      <h1>Admin dashboard</h1>
      <p>Changes here update the live storefront (demo: this browser; live: Supabase).</p>
    </div>
    <div class="admin-tabs">
      <button type="button" class="btn ghost tab active" data-tab="settings">Settings</button>
      <button type="button" class="btn ghost tab" data-tab="products">Products</button>
      <button type="button" class="btn ghost tab" data-tab="orders">Orders</button>
    </div>

    <section id="tab-settings" class="card admin-panel" style="margin-top:1rem">
      <h2>Delivery &amp; fees</h2>
      <form id="settings-form">
        <div class="row" style="gap:1rem;align-items:flex-start">
          <div class="field" style="flex:1"><label>Center lat</label><input name="delivery_center_lat" type="number" step="any" required/></div>
          <div class="field" style="flex:1"><label>Center lng</label><input name="delivery_center_lng" type="number" step="any" required/></div>
          <div class="field" style="flex:1"><label>Radius (km)</label><input name="delivery_radius_km" type="number" step="any" min="1" required/></div>
        </div>
        <div class="field"><label>Fee type</label>
          <select name="delivery_fee_type">
            <option value="flat">Flat fee</option>
            <option value="per_km">Per km</option>
            <option value="flat_plus_per_km">Flat + per km</option>
          </select>
        </div>
        <div class="row" style="gap:1rem">
          <div class="field" style="flex:1"><label>Flat fee (PHP)</label><input name="delivery_fee_flat" type="number" step="1" min="0"/></div>
          <div class="field" style="flex:1"><label>Per-km fee (PHP)</label><input name="delivery_fee_per_km" type="number" step="1" min="0"/></div>
          <div class="field" style="flex:1"><label>Free delivery min order (PHP)</label><input name="free_delivery_min_order" type="number" step="1" min="0"/></div>
        </div>
        <div class="row" style="gap:1rem">
          <div class="field" style="flex:1"><label>Oven batch slots</label><input name="oven_batch_slots" type="number" min="1"/></div>
          <div class="field" style="flex:1"><label>Packing buffer (min)</label><input name="packing_buffer_minutes" type="number" min="0"/></div>
          <div class="field" style="flex:1"><label>Delivery buffer (min)</label><input name="delivery_buffer_minutes" type="number" min="0"/></div>
        </div>
        <button class="btn primary" type="submit">Save settings</button>
        <div id="settings-msg" class="msg info" style="display:none"></div>
      </form>
    </section>

    <section id="tab-products" class="card admin-panel" hidden style="margin-top:1rem">
      <div class="product-list-head">
        <h2>Products</h2>
        <a class="btn primary add-product" href="admin-product.html" aria-label="Add product">+</a>
      </div>
      <ul id="admin-products" class="product-list"></ul>
    </section>

    <section id="tab-orders" class="card admin-panel" hidden style="margin-top:1rem">
      <h2>Incoming orders</h2>
      <div id="admin-orders"></div>
    </section>
  </div>
</main>
<footer class="site-footer"><div class="container"><p>Payment: Cash on Delivery · <a href="index.html">Storefront</a></p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
